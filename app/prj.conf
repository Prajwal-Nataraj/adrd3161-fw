CONFIG_CAN=y
CONFIG_CANOPEN=y
CONFIG_CANOPEN_LOG_LEVEL_INF=y
CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_CONFIG_FILE="CO_config_custom.h"
CONFIG_CANOPENNODE_MAINLINE_THREAD_STACK_SIZE=1024
CONFIG_CANOPENNODE_SYNC_THREAD_STACK_SIZE=1024

CONFIG_CANOPENNODE_LEDS_USE_GPIO=n
CONFIG_CANOPENNODE_LEDS_USE_CALLBACK=y

CONFIG_LOG=y
CONFIG_REBOOT=y
CONFIG_LOG_SPEED=y

# CONFIG_CAN_LOG_LEVEL_DBG=y
# CONFIG_CANOPEN_LOG_LEVEL_DBG=y
CONFIG_CANOPEN_LOG_LEVEL_INF=y

CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=n
CONFIG_SHELL_TMC_PARAMS=n
CONFIG_TMC_RWE_PARAM_NAMES=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_BUILD_OUTPUT_META=y


